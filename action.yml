name: Edicts Validate
description: Validate an edicts.yaml (or edicts.json) file for structural and field-level errors. Exits 1 if any errors found — safe to use as a PR gate.
author: edicts-ai

inputs:
  path:
    description: Path to the edicts file to validate. Defaults to auto-discovery (searches up from the workspace root).
    required: false
    default: ''
  version:
    description: "Version of the edicts npm package to use (default: latest)."
    required: false
    default: 'latest'

runs:
  using: composite
  steps:
    - name: Install edicts CLI
      shell: bash
      run: npm install -g edicts@${{ inputs.version }}
    - name: Validate edicts file
      shell: bash
      run: |
        if [ -n "${{ inputs.path }}" ]; then
          edicts --path "${{ inputs.path }}" validate
        else
          edicts validate
        fi

branding:
  icon: check-circle
  color: green
